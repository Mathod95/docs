site_name: Mathod
site_url: https://docs.mathod.fr
site_author: Mathias FELIX
site_description: DevOps Journey
copyright: "&copy; 2026 Mathias FELIX"

repo_name: Mathod95/docs
repo_url: https://github.com/Mathod95/docs
#edit_uri: https://github.com/zensical/docs/edit/master/docs/
docs_dir: docs
site_dir: site

nav:
  - HOME: index.md

theme:
  variant: modern
  custom_dir: overrides
  #font:
  #  text: Fira Sans
  #  code: Fira Code
  icon:
    repo: fontawesome/brands/github
    logo: lucide/terminal
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
#    - navigation.tabs
#    - navigation.tabs.sticky
    - navigation.sections
#    - navigation.expand
#    - navigation.path
    #- navigation.prune
    - navigation.indexes
    - toc.follow
#    - toc.integrate
    - navigation.top
    - search.highlight
    - header.autohide
#    - navigation.footer
    - content.tooltips
    - content.code.annotate
    - content.code.copy

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mathod95
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mathod/

extra_css:
 - assets/stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 6
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.caption
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
      #auto_title: true
      line_spans: __span
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  